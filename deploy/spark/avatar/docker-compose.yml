# sv-avatar: the local video avatar for CJAP on the DGX Spark.
#   cd ~/Supervaise-Reachy-Mini-Project-main/deploy/spark/avatar && docker compose up -d
# Host networking: the browser on the LAN reaches LiveKit (7880 tcp, 7881 tcp, 7882 udp)
# and the control socket (8092) at 192.168.1.201 directly; no Docker UDP proxying.
name: sv-avatar

services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    user: "1001:1001"                          # reads the mode-600 livekit.yaml owned by sv
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - /home/sv/robot/avatar/livekit.yaml:/etc/livekit.yaml:ro
    restart: "no"

  cjap-avatar:
    image: sv/cjap-avatar:1
    build:
      context: .
      dockerfile: Dockerfile.avatar
    network_mode: host
    user: "1001:1001"
    env_file:
      - /home/sv/robot/avatar/avatar.env        # keys: AVATAR_API_KEY, AVATAR_ID, LIVEKIT_API_KEY/SECRET (mode 600)
    environment:
      AVATAR_ENGINE: ${AVATAR_ENGINE:-avtr1}    # avtr1 | wav2lip | still; override from the shell
      AVATAR_PUBLIC_HOST: 192.168.1.201
      AVATAR_PORT: "8092"
      AVATAR_PHOTO: /avatar/portrait.png        # AVATAR_W x AVATAR_H, from prepare_photo.py
      AVATAR_W: "1280"
      AVATAR_H: "720"
      AVATAR_BG: plain_white                    # an AVTR-1 background name, or /avatar/<file>.png
      AVATAR_AVTR1_STEPS: "5"                   # ODE steps per chunk; 4 or 3 is faster
      AVATAR_LISTEN_PCM: plug:reachymini_audio_src_left   # the robot's mic (dsnoop); "" = off
      AVATAR_LISTEN_GAIN: "1.0"
      AVTR1_LOCAL_STORAGE: /models/avtr1
      TQDM_DISABLE: "1"                         # no progress bars in the log
      AVATAR_W2L_CKPT: /models/wav2lip/wav2lip256.pth
      AVATAR_W2L_DIR: /avatar/wav2lip
    volumes:
      - /home/sv/models:/models
      - /home/sv/robot/avatar:/avatar
      - /home/sv/.asoundrc:/tmp/.asoundrc:ro    # the mic's ALSA names (HOME=/tmp in the image)
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    ipc: host                                   # the dsnoop shares the mic through host IPC
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    mem_limit: 24g
    depends_on: [livekit]
    restart: "no"
